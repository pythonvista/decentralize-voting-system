
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voting Page</title>

    <link rel="stylesheet" type="text/css" href="../css/index.css">
    
  </head>
  <body>
    <div id="head" class="text-center">
      <h1 align="center">Decentralized Voting</h1>
      <h2 align="center">Cast your vote</h2>
      <button id="logoutBtn" class="btn btn-primary">Logout</button>
      <br/>
    </div>
    <div id="candidate" class="container">
      <table class="table text-center">
        <thead>
          <tr>
            <th>Name</th>
            <th>Party</th>
            <th>Total Votes</th>
          </tr>
        </thead>
        <tbody id="boxCandidate"></tbody>
      </table>
      <br/>
      <div id="vote">
        <p>Please select one candidate and click vote.</p>
        <button id="voteButton" class="btn btn-primary">Vote</button>
        <div id="msg"></div>
      </div>
    </div>
    <script src="../js/vote.js" type="module"></script>
  </body>
</html>
