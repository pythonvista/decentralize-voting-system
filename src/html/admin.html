
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin portal</title>

    <link rel="stylesheet" type="text/css" href="../css/admin.css">
    
  </head>
  <body>
    <div id="head" class="text-center">
      <h1 align="center" style="color: azure;">Decentralized Voting Admin</h1>
      <button id="logoutBtn" class="btn btn-primary">Logout</button>
      <br/>
    </div>

    <div class="container">
      <legend>Add Candidate</legend>
      <form id="candidateForm">
        <table class="table text-center">
          <tr>
            <th>Name</th>
            <td><input id="candidate-name" type="text" placeholder="Candidate name" autocomplete="off"></td>
            <th>Party</th>
            <td><input id="candidate-party" type="text" placeholder="Candidate party"></td>
          </tr>
        </table>
        <button type="submit" class="btn btn-primary">Add Candidate</button>
      </form>
      <p id="adminMessage"></p>
    </div>

    <div class="container">
      <legend>Current Candidates</legend>
      <table class="table text-center">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Party</th>
            <th>Votes</th>
          </tr>
        </thead>
        <tbody id="candidateTableBody"></tbody>
      </table>
    </div>
    <script src="../js/admin.js" type="module"></script>
  </body>
</html>
